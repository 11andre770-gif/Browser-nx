name: Build NX Browser

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    steps:
      - uses: actions/checkout@v4

      - name: Install Switch development packages
        run: |
          pacman -Sy --noconfirm switch-dev

      - name: Build
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXBrowser-nro
          path: NXBrowser.nro
